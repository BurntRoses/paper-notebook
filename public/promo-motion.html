<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Notebook · 产品推介片</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e5da;color:#304f58;font:16px/1.7 system-ui,sans-serif}main{max-width:1450px;margin:auto;padding:22px 30px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.brand{font:600 22px Georgia,serif;letter-spacing:.01em}nav{display:flex;gap:12px;flex-wrap:wrap}a{color:inherit;text-underline-offset:5px}header a{text-decoration:none;font-size:14px}h1{font:500 clamp(26px,3vw,42px)/1.4 'Songti SC',Georgia,serif;margin:0 0 12px}.lead{margin:0 0 24px;color:#687871;font-size:15px}.player{display:grid;grid-template-columns:1fr 240px;gap:22px;align-items:start}video{display:block;width:100%;max-height:calc(100dvh - 255px);background:#d9d2bf;box-shadow:0 12px 35px #40372322;border-radius:5px}aside{border-top:1px solid #8b9a8c66;padding-top:14px}.formats{display:flex;gap:6px;margin-bottom:18px}button{font:inherit;cursor:pointer;color:inherit;border:1px solid #8d9c8d60;background:#faf8ef;border-radius:5px;padding:9px 16px}button[aria-pressed=true]{background:#345f62;color:#fffdf3}.chapters{display:grid;gap:5px}.chapters button{display:flex;gap:12px;border:0;background:transparent;text-align:left;padding:8px 4px;font-size:14px}.chapters button[aria-current=true]{color:#a05d37;background:#f7f3e7}.chapters span{font:12px/2 ui-monospace,monospace;color:#8b866c}.details{color:#788171;font-size:12px;margin:18px 0 0}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}.actions a{border:1px solid #96a58d66;background:#faf8ef;padding:9px 18px;border-radius:5px;text-decoration:none;font-size:14px}.actions a:first-child{background:#345f62;color:#fffdf3}.downloads{font-size:13px;margin-top:14px;display:flex;gap:18px}button:focus-visible,a:focus-visible{outline:2px solid #345f62;outline-offset:4px}@media(max-width:800px){main{padding:18px}.player{grid-template-columns:1fr}video{max-height:75dvh}aside{display:flex;gap:18px;flex-wrap:wrap}.chapters{grid-template-columns:repeat(2,1fr);width:100%}.details{margin:0}.formats{margin:0}header{align-items:flex-start}.lead{font-size:14px}}
</style></head><body><main>
<header><a class="brand" href="promo.html">Paper Notebook</a><nav><a href="downloads/paper-notebook-product.html">产品笔记 ↗</a><a href="downloads/paper-notebook.html">试读学习笔记 ↗</a></nav></header>
<h1>用 Skill，让 AI 生成学习笔记。</h1><p class="lead">Agent 调用 Skill；ChatGPT、DeepSeek 用对话指令。生成后即可阅读、圈画、复习。</p>
<div class="player"><video id="film" controls playsinline preload="metadata" poster="promo/story/film-landscape-poster-1.png" src="promo/paper-notebook-film.mp4"></video><aside><div class="formats" role="group" aria-label="视频方向"><button id="landscape" aria-pressed="true">横屏</button><button id="portrait" aria-pressed="false">竖屏</button></div><div class="chapters" aria-label="片段导航">
<button data-time="0" aria-current="true"><span>00:00</span>Skill 与对话生成</button><button data-time="8"><span>00:08</span>长篇讲解怎么读</button><button data-time="16"><span>00:16</span>条件、推导与例子</button><button data-time="24"><span>00:24</span>圈画与复习线索</button><button data-time="32"><span>00:32</span>公式、原文与代码</button><button data-time="40"><span>00:40</span>按基础和材料生成</button><button data-time="48"><span>00:48</span>沉浸与离线阅读</button><button data-time="56"><span>00:56</span>生成自己的笔记</button>

</main><script>
const film=document.querySelector('#film'),status=document.querySelector('#player-status');film.volume=.8;
const sources={landscape:'promo/paper-notebook-film.mp4',portrait:'promo/paper-notebook-film-portrait.mp4'},cache=new Map(),chapters=[...document.querySelectorAll('[data-time]')];
let active='landscape',pendingTime=0,wantsPlay=false,request=0,positioning=false;
const metadata=()=>new Promise((resolve,reject)=>{film.addEventListener('loadedmetadata',resolve,{once:true});film.addEventListener('error',reject,{once:true});});
const canSeek=time=>time<.05||Array.from({length:film.seekable.length},(_,i)=>[film.seekable.start(i),film.seekable.end(i)]).some(([a,b])=>time>=a&&time<=b);
async function position(time,play){
 pendingTime=time;wantsPlay=play;positioning=true;const token=++request,direction=active;
 try{
  if(film.readyState<1)await metadata();if(token!==request)return;
  // A plain static server may omit byte-range support. A local Blob keeps
  // chapter navigation functional there and also works with offline files.
  if(!canSeek(time)){
   status.textContent='正在准备章节…';
   if(!cache.has(direction))cache.set(direction,fetch(sources[direction]).then(r=>{if(!r.ok)throw Error('media');return r.blob();}).then(b=>URL.createObjectURL(b)).catch(e=>{cache.delete(direction);throw e;}));
   const url=await cache.get(direction);if(token!==request)return;
   const ready=metadata();film.src=url;film.load();await ready;if(token!==request)return;
  }
  film.currentTime=Math.min(time,film.duration-.01);status.textContent='';if(wantsPlay)await film.play();
 }catch(e){if(token===request)status.textContent='暂时无法定位该片段，请稍后重试或下载观看。';}finally{if(token===request)positioning=false;}
}
for(const direction of ['landscape','portrait'])document.querySelector('#'+direction).onclick=()=>{
 if(direction===active)return;const time=positioning?pendingTime:film.currentTime,playing=!film.paused||(positioning&&wantsPlay);request++;active=direction;pendingTime=time;film.pause();
 film.poster='promo/story/film-'+direction+'-poster-1.png';film.src=sources[direction];film.load();position(time,playing);
 for(const id of ['landscape','portrait'])document.querySelector('#'+id).setAttribute('aria-pressed',String(id===direction));
};
chapters.forEach(b=>b.onclick=()=>position(Number(b.dataset.time),true));
film.addEventListener('timeupdate',()=>{const index=Math.min(7,Math.floor(film.currentTime/8));chapters.forEach((b,i)=>b.setAttribute('aria-current',String(i===index)));});
film.addEventListener('ended',()=>{wantsPlay=false;});
addEventListener('pagehide',()=>{for(const value of cache.values())value.then(url=>URL.revokeObjectURL(url));});
</script></body></html>
